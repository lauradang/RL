# SingleController smoke configuration for deterministic weighted mixing across
# two datasets and two environments.
defaults: grpo_math_1B_megatron_single_controller.yaml

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 4
  max_num_steps: 10
  use_dynamic_sampling: false

policy:
  train_global_batch_size: 16
  train_micro_batch_size: 8

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: true
  train:
    - dataset_name: gsm8k
      env_name: math
      weight: 3.0
    - dataset_name: DAPOMath17K
      env_name: math_multi_reward
      weight: 1.0
  validation: null
  default:
    prompt_file: examples/prompts/cot.txt
    system_prompt_file: null
    processor: math_hf_data_processor
    env_name: math

env:
  math_multi_reward:
    num_workers: 8
    math_verify_impl: hf_math_verify
