# SingleController variant with Megatron prefill/decode engines behind Dynamo.
#
# Generation is disaggregated: the Dynamo frontend sends each request's prefill
# to a prefill engine, hands the KV cache to a decode engine over NIXL, and
# streams the completion back. The engines are NeMo RL's dedicated Megatron
# inference policies (one worker group per engine); next to each runs
# Megatron-LM's Dynamo adapter, which registers the engine with the frontend.
#
# Weight updates use the collective transport, as for backend: megatron with
# colocated.enabled: false. Before each refit the prefill engines stop
# scheduling first, decode keeps running until every handed-off prefill block
# is pulled, then every engine is suspended; after the refit decode resumes,
# then prefill. The SingleController bounds that wait with its pause timeout:
# async_rl.generation_fleet_health.refit_timeout_s plus a 60 s grace, or 360 s
# when refit_timeout_s is null (as here).
defaults: grpo_math_1B_megatron_single_controller.yaml

async_rl:
  # Must be false: engines keep their caches across the refit
  # (kv_cache_management_mode: persist); the pause does not clear KV.
  recompute_kv_cache_after_weight_updates: false
  generation_fleet_health:
    # The Dynamo frontend owns routing, and the engines cannot abort their
    # refit collective.
    enabled: false
    refit_timeout_s: null

policy:
  # Training uses the Megatron backend inherited from
  # grpo_math_1B_megatron_single_controller.yaml; the engines receive its
  # logical weights through the collective refit.
  generation:
    backend: dynamo
    refit_transport: null
    dynamo_cfg:
      engine: megatron
      # The adapter sidecars start at setup but the engines register only at
      # the first weight update, after the trainer is built; this timeout
      # covers that whole window.
      startup_timeout_s: 3600
      request_timeout_s: 900
      # Bounds the shutdown handshake that releases prefill handoff pins. The
      # pre-refit pin wait uses it only when the caller passes no timeout; the
      # SingleController always passes its own (see the header).
      control_timeout_s: 900
      metrics_include_prefixes: null
      metrics_exclude_prefixes: null
      # Megatron-LM source tree the adapter imports. null resolves to the
      # Megatron-LM nested in the Megatron-Bridge submodule.
      megatron_root: null
      # The Megatron adapter reads only endpoint_types and extra_cli_args. The
      # parser, structural-tag and template fields configure dynamo.vllm
      # workers; they are required by the schema, and setting a parser, a
      # template or enable_structural_tag: true is rejected for engine: megatron.
      worker_args:
        tool_call_parser: null
        reasoning_parser: null
        exclude_tools_when_tool_choice_none: true
        enable_structural_tag: false
        structural_tag_scope: auto
        structural_tag_schema: auto
        custom_jinja_template: null
        # Base models without a chat template serve completions only.
        endpoint_types: [completions]
        extra_cli_args: []
      frontend_args:
        tokenizer: default
        tokenizer_cache: false
        tokenizer_cache_bytes: 52428800
        router_mode: kv
        extra_cli_args: []
      # Per-engine layouts. Empty (the default) runs every engine at the
      # mcore_generation_config layout. Otherwise list one entry per prefill
      # (decode) engine of a replica, in order: exactly
      # disaggregation.num_prefill_engines (num_decode_engines) entries, each
      # giving both sizes. Megatron reshards the KV handoff between any two
      # engines, so they need not match. For example:
      #   prefill_engines:
      #     - tensor_model_parallel_size: 4
      #       pipeline_model_parallel_size: 1
      prefill_engines: []
      decode_engines: []
    # One prefill and one decode engine per replica; every engine has the
    # layout of policy.megatron_cfg with mcore_generation_config applied, plus
    # its own entry in the dynamo_cfg lists above.
    disaggregation:
      enabled: true
      num_prefill_engines: 1
      num_decode_engines: 1
    mcore_generation_config:
      # KV handoff reads the registered cache buffers in place; prefix caching
      # is the allocator decode admission reuses. Both are required.
      enable_prefix_caching: true
      kv_cache_management_mode: persist
      # The Dynamo frontend is the HTTP surface.
      expose_http_server: false
    # vLLM is not involved when dynamo_cfg.engine is megatron.
    vllm_cfg: null
    vllm_kwargs: {}
    colocated:
      enabled: false
      resources:
        gpus_per_node: 2
        num_nodes: 1

cluster:
  gpus_per_node: 3
  num_nodes: 1

logger:
  log_dir: results/grpo-math-1b-dynamo-pd-megatron-single-controller
  wandb:
    name: grpo-dynamo-pd-megatron-single-controller-dev
  swanlab:
    name: grpo-dynamo-pd-megatron-single-controller-dev
  mlflow:
    run_name: grpo-dynamo-pd-megatron-single-controller-dev
